name: Divine Integration Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CH_URL: "http://127.0.0.1:8123/?user=default&password=test"

jobs:
  divine-integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
          CLICKHOUSE_PASSWORD: "test"
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1' --password test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply ClickHouse schema
        run: |
          # Split SQL file into individual statements and execute each
          # ClickHouse HTTP interface processes one statement per request
          python3 -c "
          import re, sys
          with open('divine/clickhouse-schema/001_osprey_events.sql') as f:
              sql = f.read()
          # Remove comments
          sql = re.sub(r'--.*$', '', sql, flags=re.MULTILINE)
          # Split on semicolons, filter empty
          stmts = [s.strip() for s in sql.split(';') if s.strip()]
          for i, stmt in enumerate(stmts):
              with open(f'/tmp/stmt_{i}.sql', 'w') as out:
                  out.write(stmt)
              print(f'Statement {i}: {stmt[:80]}...')
          print(f'Total: {len(stmts)} statements')
          "
          for f in /tmp/stmt_*.sql; do
            echo "Executing $f..."
            # Show error body on failure for debugging
            if ! curl -sf "$CH_URL" --data-binary @"$f"; then
              echo "Failed. Server response:"
              curl -s "$CH_URL" --data-binary @"$f"
              exit 1
            fi
          done
          echo "Schema applied successfully"

      - name: Verify schema created
        run: |
          TABLES=$(curl -sf "$CH_URL" --data-binary "SHOW TABLES FROM osprey")
          echo "Tables: $TABLES"
          echo "$TABLES" | grep -q "osprey_events"

      - name: Verify table structure
        run: |
          curl -sf "$CH_URL" --data-binary "DESCRIBE TABLE osprey.osprey_events"

      # Every effect that reaches the output sink needs a matching column, or the
      # sink drops the whole batch and the error is swallowed -- the enforcement
      # still happens, but the record of it silently disappears. This caught
      # __age_restrict_nostr_event shipping without its column.
      - name: Verify every effect feature has a ClickHouse column
        run: |
          curl -sf "$CH_URL" --data-binary \
            "SELECT name FROM system.columns WHERE database='osprey' AND table='osprey_events' FORMAT TSV" > /tmp/columns.tsv
          python3 - <<'EOF'
          import pathlib, re, sys

          columns = set(pathlib.Path('/tmp/columns.tsv').read_text().split())
          missing = []
          for path in pathlib.Path('divine/plugins/src/udfs').glob('*.py'):
              src = path.read_text()
              # CustomExtractedFeature subclasses declare their wire name here.
              for name in re.findall(r"def feature_name\(cls\)[^:]*:\s*\n\s*return '([^']+)'", src):
                  if f'__{name}' not in columns:
                      missing.append(f'{path.name}: {name} -> missing column __{name}')

          if missing:
              print('Effect features with no ClickHouse column:')
              for m in missing:
                  print(f'  {m}')
              sys.exit(1)
          print('All effect features have columns.')
          EOF

      - name: Insert test event
        run: |
          curl -sf "$CH_URL" \
            --data-binary "INSERT INTO osprey.osprey_events (__time, __action_id, EventType, UserId, ActionName) VALUES (now(), 1001, 'nostr_kind1', 'npub1test', 'test_action')"

      - name: Query test event
        run: |
          RESULT=$(curl -sf "$CH_URL" \
            --data-binary "SELECT count() FROM osprey.osprey_events WHERE __action_id = 1001")
          echo "Count: $RESULT"
          [ "$RESULT" -eq 1 ] || (echo "Expected 1 row, got $RESULT" && exit 1)

      - name: Verify Divine plugin files exist
        run: |
          test -f divine/plugins/src/divine_register_plugins.py
          test -f divine/plugins/src/udfs/ban_nostr_event.py
          test -f divine/plugins/src/udfs/nostr_account_age.py
          test -f divine/plugins/src/udfs/check_moderation_result.py
          test -f divine/plugins/src/services/relay_manager_sink.py
          test -f divine/plugins/src/services/zendesk_sink.py
          echo "All plugin files present"

      # divine/ is never copied into the test_runner image, so the repo-wide pytest run
      # cannot see these. Run them here instead of leaving them uncollected.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Run Divine plugin unit tests
        run: |
          python -m pip install --quiet pytest websocket-client==1.9.0
          PYTHONPATH=divine/plugins/src python -m pytest divine/plugins/tests -q

      - name: Verify every SML Require and Import resolves
        run: |
          # Was a hand-maintained list of `test -f` paths, which asserted only that
          # some named files existed and went stale the moment a rule was retired.
          # This resolves the graph instead: every Require/Import target must exist,
          # and main.sml must still reach rules. A dangling Require fails the bundle
          # load at runtime, which is the failure actually worth catching here.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          root = Path('divine/rules')
          entry = root / 'main.sml'
          if not entry.is_file():
              sys.exit('FAIL: divine/rules/main.sml is missing')

          sml = sorted(root.rglob('*.sml'))
          if not sml:
              sys.exit('FAIL: no .sml files found under divine/rules')

          missing = []
          requires = 0
          for f in sml:
              text = f.read_text()
              for target in re.findall(r"Require\(rule='([^']+)'\)", text):
                  requires += 1
                  if not (root / target).is_file():
                      missing.append(f'{f.relative_to(root)} -> Require {target}')
              for block in re.findall(r'Import\(\s*rules=\[(.*?)\]', text, re.S):
                  for target in re.findall(r"'([^']+)'", block):
                      if not (root / target).is_file():
                          missing.append(f'{f.relative_to(root)} -> Import {target}')

          if missing:
              sys.exit('FAIL: unresolved SML references:\n  ' + '\n  '.join(missing))
          if requires == 0:
              sys.exit('FAIL: no Require() found, so this check verified nothing')

          print(f'OK: {len(sml)} .sml files, {requires} Require targets, all resolve')
          PY

      - name: Verify Nostr-Kafka bridge
        run: |
          test -f divine/nostr-kafka-bridge/main.py
          test -f divine/nostr-kafka-bridge/requirements.txt
          test -f divine/nostr-kafka-bridge/Dockerfile
          echo "Bridge files present"

      # Same reason as the plugin tests above: divine/ never reaches the test_runner
      # image. These two directories are pure stdlib (the bridge stubs its heavy
      # imports), so they need no PYTHONPATH and no osprey environment.
      # Relies on the Set up Python step above; keep this after it.
      - name: Run Divine bridge and rules tests
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest
          python -m pytest divine/nostr-kafka-bridge divine/rules/tests -q
