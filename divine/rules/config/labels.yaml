## Vocabulary note
#
# These labels are Osprey's internal state. They need to map to the canonical
# moderation vocabulary used across Divine's stack:
#
#   Osprey verdict     | relay-manager action  | moderation-service tier | Blossom state
#   -------------------|-----------------------|-------------------------|---------------
#   approve            | reviewed / dismissed  | SAFE                    | APPROVE
#   restrict           | (not implemented)     | AGE_RESTRICTED          | RESTRICT
#   flag_for_review    | (queue for human)     | REVIEW                  | (pending)
#   auto_hide          | auto_hidden           | (n/a)                   | (n/a)
#   ban                | delete_event          | PERMANENT_BAN           | BLOCK
#   ban_user           | ban_pubkey            | (n/a)                   | (n/a)
#   suspend            | (not implemented)     | (n/a)                   | (n/a)
#   restore            | (undo ban)            | (n/a)                   | APPROVE
#
# See: support-trust-safety/docs/moderation-vocabulary-alignment.md

labels:
  # --- Account lifecycle ---

  new_account_activity:
    valid_for: [Pubkey]
    connotation: neutral
    description: Account is newly created and showing early activity patterns

  verified:
    valid_for: [Pubkey]
    connotation: positive
    description: Account has been verified as legitimate

  trusted_reporter:
    valid_for: [Pubkey]
    connotation: positive
    description: Account is a trusted source for NIP-56 moderation reports

  moderation_service:
    valid_for: [Pubkey]
    connotation: neutral
    description: Events from this pubkey are from the AI moderation service (not a human user)

  # --- Enforcement state (graduated) ---

  warned:
    valid_for: [Pubkey]
    connotation: negative
    description: Account has been warned for policy violations (strike 1)

  suspended:
    valid_for: [Pubkey]
    connotation: negative
    description: Account is temporarily suspended from the platform (strike 2)

  banned:
    valid_for: [Pubkey, EventId]
    connotation: negative
    description: Account or event is permanently banned (strike 3 / immediate for severe violations)

  rate_limited:
    valid_for: [Pubkey]
    connotation: negative
    description: Account is rate limited due to suspicious activity

  # --- Multi-report threshold tracking ---

  reporter_counted:
    valid_for: [EventReporter]
    connotation: neutral
    description: >-
      This specific (reported event, report category, reporter) triple has
      already been counted toward a multi-report threshold. Makes each
      reporter's contribution idempotent so one reporter cannot satisfy the
      threshold alone. The category belongs in the key: one label guards every
      category's rules at once, so a key without it lets a reporter's first
      report silently swallow their later report of the same event under a
      different category.

  sexual_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one report of sexual content (nudity) received for this event

  violence_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one report of violence received for this event

  child_safety_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one child-safety report received for this event (distinct from CSAM)

  harassment_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one report of harassment received for this event

  # Dedup labels for the reasons that previously matched no rule at all, so an
  # ordinary user's report of them never reached a moderator through Osprey.
  # valid_for stays event-scoped: these mark the reported EVENT, never an account,
  # so they cannot widen into an account-level enforcement path.
  csam_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one CSAM report received for this event

  illegal_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one report of illegal content received for this event

  illegal_auto_hidden:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: A trusted illegal-content report auto-hid this event

  spam_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one spam report received for this event

  impersonation_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one impersonation report received for this event

  other_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one uncategorised report received for this event

  ai_generated_reported:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: At least one AI-generated report received for this event from an ordinary reporter

  threshold_met:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: Multi-report threshold met, escalated for human review

  auto_hidden:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: Content auto-hidden by enforcement action (CSAM, trusted reporter)

  # --- Content flags ---

  nsfw_flagged:
    valid_for: [Pubkey, ReportedPubkey]
    connotation: negative
    description: Content flagged for NSFW by a trusted reporter or AI classification

  age_restricted:
    valid_for: [EventId, ReportedEventId]
    connotation: negative
    description: Content requires age verification to view (maps to Blossom RESTRICT)

  ai_classified:
    valid_for: [EventId]
    connotation: neutral
    description: Content has been classified by the AI moderation pipeline (result in verdict)

  # --- Human review ---

  human_reviewed:
    valid_for: [EventId, ReportedEventId, Pubkey, MediaHash]
    connotation: neutral
    description: >-
      A human moderator has reviewed this content or account. Human decisions
      override automated ones. MediaHash is here because a label often names the
      media and no event, and a decision on that shape has nowhere else to be
      recorded: written to the empty event entity it would be lost, and the
      automated rules would re-decide content a human had already cleared.
